999999 603.9244995117188 -9.750000000000114)" fill="rgb(31, 32, 32)" stroke="rgb(204, 204, 204)" stroke-width="1px" x="0px" y="0px" width="0px" height="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 132 91.99999999999989)" fill="rgb(255, 240, 219)" stroke="rgb(194, 118, 32)" stroke-width="2px" x="-124px" y="-42px" width="248px" height="84px" rx="0px" ry="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 30.429687499999993 56.999999999999886)" fill="rgb(31, 32, 32)" stroke="rgb(204, 204, 204)" stroke-width="1px" x="0px" y="0px" width="0px" height="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 313.3333435058593 275.9999999999999)" fill="rgb(219, 234, 254)" stroke="rgb(37, 99, 166)" stroke-width="2px" x="-124px" y="-42px" width="248px" height="84px" rx="0px" ry="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 213.75521850585932 251.9999999999999)" fill="rgb(31, 32, 32)" stroke="rgb(204, 204, 204)" stroke-width="1px" x="0px" y="0px" width="0px" height="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 313.3333435058593 459.9999999999999)" fill="rgb(219, 234, 254)" stroke="rgb(37, 99, 166)" stroke-width="2px" x="-124px" y="-42px" width="248px" height="84px" rx="0px" ry="0px"/><rect transform="matrix(0.9999999999999999 0 0 0.9999999999999999 203.25521850585938 433.7499999999998)" fill="rgb(31, 32, 32)" stroke="rgb(204, 204, 204)" stroke-width="1px" x="0px" y="0px" width="0px" height="0px"/></g><g font-family="Arial, sans-serif"><text x="131.99999877591097" y="-467.00000053045426" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">Scrape wine data</text><text x="132.000002590667" y="-442.999998826229" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">from Vivino</text><text x="585.3333087742736" y="-467.00000053045426" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">Scrape wine data</text><text x="585.3254961538868" y="-442.999998826229" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">from SimpleWine</text><text x="313.3333441378899" y="-282.99999763740954" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">Clean, normalise</text><text x="313.3333441378899" y="-258.99998639629405" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">and merge scraped data</text><text x="630.6666794475727" y="-179.75000102328778" text-anchor="middle" font-size="13px" font-weight="400" fill="rgb(53, 86, 64)">Random Forest</text><text x="313.3333441378899" y="-99.00000809601096" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">Classical ML model</text><text x="313.3333441378899" y="-75.00000448440755" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">training (regression)</text><text x="630.6667099656212" y="-87.75000243783245" text-anchor="middle" font-size="13px" font-weight="400" fill="rgb(53, 86, 64)">XGBoost</text><text x="630.6666794475727" y="4.249996147622937" text-anchor="middle" font-size="13px" font-weight="400" fill="rgb(53, 86, 64)">CatBoost</text><text x="131.99218615552417" y="70.00002504044983" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(117, 67, 15)">Reformulate as classification</text><text x="131.99999496115493" y="87.49998952635019" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(117, 67, 15)">to reduce price bias:</text><text x="132.000002590667" y="105.00001504834722" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(117, 67, 15)">above / below the average rating</text><text x="131.99999877591097" y="122.49997953424747" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(117, 67, 15)">within each price range</text><text x="313.3333441378899" y="269.0000015048346" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">Explain model predictions</text><text x="313.3255315175031" y="293.00000511643793" text-anchor="middle" font-size="16px" font-weight="600" fill="rgb(21, 58, 91)">with SHAP</text><text x="313.3255315175031" y="446.749971107173" text-anchor="middle" font-size="14px" font-weight="600" fill="rgb(21, 58, 91)">Website deployed on Vercel</text><text x="313.32552388799104" y="464.24999662917" text-anchor="middle" font-size="14px" font-weight="600" fill="rgb(21, 58, 91)">Explore predictions and</text><text x="313.3333441378899" y="481.75002215116706" text-anchor="middle" font-size="14px" font-weight="600" fill="rgb(21, 58, 91)">explanations for individual wines</text><rect x="146.39357689368774" y="-395.99999855535873" width="152.5468605234899" height="37.00000556788848" fill="rgb(13, 17, 23)"/><text x="222.66703004396896" y="-382.99999735149095" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">Reverse-engineered API</text><text x="222.65920979407008" y="-361.99999419133803" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">to bypass CAPTCHA</text><rect x="372.8798702269087" y="-395.99999855535873" width="152.90628683835416" height="37.00000556788848" fill="rgb(13, 17, 23)"/><text x="449.33299838706165" y="-382.99999735149095" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">Static HTML scraping</text><text x="449.3330136460858" y="-361.99999419133803" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">with Scrapy + Playwright</text><rect x="136.13575891608934" y="-18.999987600161944" width="133.06252097739616" height="36.99995979081598" fill="rgb(13, 17, 23)"/><text x="202.6670270342995" y="-5.999986396294162" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">Price bias discovered</text><text x="202.6592144139127" y="15.000001504834586" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">in consumer ratings</text><rect x="543.8030972908196" y="307.90000818630074" width="99.59375878823482" height="36.99995979081598" fill="rgb(13, 17, 23)"/><text x="593.599976684937" y="320.90000939016863" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">Best-performing</text><text x="593.5921640645502" y="341.89996677324893" text-anchor="middle" font-size="14px" font-weight="400" fill="rgb(209, 213, 219)">model</text></g></svg>
