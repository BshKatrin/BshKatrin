<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 -507 713.6666870117188 1014" width="714" height="1014" role="img" aria-labelledby="title description"><title id="title">Decoding the bottle: wine rating prediction workflow</title><desc id="description">Scrape wine data from Vivino and SimpleWine, clean and merge it, train regression models and reformulate as classification to reduce price bias. Explain predictions with SHAP and deploy the best-performing CatBoost model on Vercel to explore individual wines.</desc><defs><marker id="arrow-0" class="marker block" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="stroke-width: 1; stroke-dasharray: 1, 0;" fill="rgb(72, 123, 165)" stroke="rgb(72, 123, 165)" stroke-width="1"/></marker><marker id="arrow-1" class="marker block" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="stroke-width: 1; stroke-dasharray: 1, 0;" fill="rgb(194, 118, 32)" stroke="rgb(194, 118, 32)" stroke-width="1"/></marker><marker id="arrow-2" class="marker block" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="stroke-width: 1; stroke-dasharray: 1, 0;" fill="rgb(138, 170, 146)" stroke="rgb(138, 170, 146)" stroke-width="1"/></marker></defs><g fill="none"><path d="M 132 -326 C 132 -280 313.333 -288 313.333 -250" transform="matrix(0.9999999999999999 0 0 0.9999999999999999 -3.552713678800501e-15 -92.00000000000011)" stroke="rgb(72, 123, 165)" stroke-width="2px" stroke-dasharray="0px"/><path d="M 585.333 -326 C 585.333 -280 313.333 -288 313.333 -250" transform="matrix(0.9999999999999999 0 0 0.9999999999999999 -3.552713678800501e-15 -92.00000000000011)" stroke="rgb(72, 123, 165)" stroke-width="2px" stroke-dasharray="0px"/><path d="M 313.333 -250 L 313.