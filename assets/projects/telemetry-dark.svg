  <title id="title">Keeping an eye on the room</title>
  <desc id="desc">Two conceptual room-sensor traces on a shared time grid: a continuous copper or amber temperature-like signal and a dashed dusk-blue humidity-like signal. No numeric readings or deployment status are implied.</desc>
